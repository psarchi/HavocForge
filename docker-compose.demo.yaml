# Slim demo compose. Single-service: just the FastAPI demo app.
# No Redis, no Postgres, no Grafana, no Kafka — everything stateless and in-memory.
#
#   docker compose -f docker-compose.demo.yaml up -d
#
# To expose publicly via Cloudflare Tunnel, see demo/cloudflared/README.md.

services:
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    container_name: havocforge-demo
    ports:
      - "${DEMO_PORT:-8080}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HAVOCFORGE_DEMO=1
    restart: unless-stopped
    # Runtime mounts (read-only) so you can iterate on the engine without rebuilding.
    # Comment these out if you prefer the baked-in copy from the image.
    volumes:
      - ./havocforge:/app/havocforge:ro
      - ./schemas:/app/schemas:ro
      - ./config:/app/config:ro
      - ./demo:/app/demo:ro
